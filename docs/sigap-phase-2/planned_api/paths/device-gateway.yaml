# =====================================================================
# paths/device-gateway.yaml — path domain Device Gateway (M2M)
# Poll level dan heartbeat sudah berjalan: api_spec/paths/device.yaml.
# =====================================================================

device-siren-events:
  post:
    tags: [Device Gateway]
    summary: >
      Laporan aktivasi sirine dari Unit Utama - jalur fisik baru
      (relatedActionId kosong) ATAU ack eksekusi command digital
      (relatedActionId diisi). Lihat deskripsi schema untuk detail.
    security:
      - deviceToken: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/device-gateway.yaml#/SirenEventReportRequest'
    responses:
      '201':
        description: Event tercatat/diperbarui
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../../../api_spec/schemas/shared.yaml#/SuccessEnvelope'
                - type: object
                  properties:
                    data:
                      $ref: '../schemas/iot-kesiapsiagaan.yaml#/SirenActionLog'
      '401':
        $ref: '../../../api_spec/paths/shared.yaml#/Unauthorized'
      '404':
        $ref: '../../../api_spec/paths/shared.yaml#/NotFound'
      '409':
        description: levelAtTrigger bukan ORANGE/RED - safeguard by design
        content:
          application/json:
            schema:
              $ref: '../../../api_spec/schemas/shared.yaml#/ErrorEnvelope'