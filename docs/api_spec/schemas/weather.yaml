# =====================================================================
# schemas/weather.yaml - schema domain Cuaca, Gempa, dan Tsunami
# =====================================================================

CurrentWeather:
  type: object
  properties:
    temperature:
      type: number
    humidity:
      type: number
    weather:
      type: string
      example: "Hujan Ringan"
    windSpeed:
      type: number
    windDirection:
      type: string
    visibility:
      type: string
      example: "10 km"
    updatedAt:
      type: string
      format: date-time

WeatherForecastItem:
  type: object
  properties:
    label:
      type: string
      example: "Hari Ini"
    date:
      type: string
    condition:
      type: string
      example: "Cerah Berawan"
    temperature:
      type: number
    rainProbability:
      type: number
      minimum: 0
      maximum: 100

EarthquakeInfo:
  type: object
  nullable: true
  properties:
    magnitude:
      type: number
    depth:
      type: string
      example: "18 km"
    location:
      type: string
    coordinates:
      type: object
      properties:
        latitude:
          type: number
        longitude:
          type: number
    distanceToVillage:
      type: number
      description: Jarak dalam kilometer dari VILLAGE_LAT dan VILLAGE_LON (Haversine).
    felt:
      type: string
      description: Field Dirasakan dari BMKG. Dapat berupa string kosong.
    feltAreas:
      type: array
      description: Hasil parsing `felt` per wilayah.
      items:
        type: object
        properties:
          area:
            type: string
            example: "Pangandaran"
          mmi:
            type: string
            nullable: true
            example: "II-III"
    potential:
      type: string
      example: "Tidak berpotensi tsunami"
    tsunamiPotential:
      type: string
      nullable: true
      enum: [TIDAK_BERPOTENSI, INFORMASI_DIRASAKAN, BERPOTENSI, TIDAK_DIKENAL]
      description: >
        Klasifikasi `potential`. Hanya teks yang terverifikasi yang dikenali; teks lain
        bernilai TIDAK_DIKENAL. Kosong bila `potential` kosong.
    shakemap:
      type: string
      description: URL lengkap, atau string kosong bila tidak tersedia.
    updatedAt:
      type: string
      format: date-time

TsunamiStatus:
  type: object
  properties:
    status:
      type: string
      enum: [NORMAL, WASPADA, SIAGA, AWAS, UNKNOWN]
      description: >
        SIAGA dan AWAS hanya berasal dari BMKG_TSUNAMI_STATUS. Estimasi otomatis
        dari field Potensi dibatasi sampai WASPADA. UNKNOWN bila BMKG_TSUNAMI_STATUS
        kosong dan data gempa BMKG gagal diambil.
    description:
      type: string
    source:
      type: string
      example: "BMKG (estimasi dari data gempa)"
      description: >
        "BMKG InaTEWS" untuk status dari BMKG_TSUNAMI_STATUS,
        "BMKG (estimasi dari data gempa)" untuk estimasi WASPADA,
        "BMKG" untuk hasil estimasi NORMAL, dan "SIGAP" untuk UNKNOWN.
    updatedAt:
      type: string
      format: date-time
      nullable: true
      description: >
        Waktu data sumber: saat backend membaca BMKG_TSUNAMI_STATUS untuk status
        resmi, waktu gempa asal untuk estimasi WASPADA, atau waktu data gempa BMKG
        terakhir berhasil diambil untuk NORMAL dan UNKNOWN. null bila data gempa
        belum pernah berhasil diambil sejak backend berjalan.
