# =====================================================================
# schemas/auth.yaml - schema domain Auth
# =====================================================================

LoginRequest:
  type: object
  required: [email, password]
  properties:
    email:
      type: string
      format: email
      maxLength: 254
    password:
      type: string
      format: password
      minLength: 6
      maxLength: 128

LoginResponse:
  type: object
  properties:
    token:
      type: string
    user:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        roles:
          type: array
          items:
            type: string

TokenClaims:
  type: object
  properties:
    sub:
      type: string
      format: uuid
    name:
      type: string
    email:
      type: string
      format: email
    roles:
      type: array
      items:
        type: string
    permissions:
      type: array
      items:
        type: string
    jti:
      type: string
    tokenVersion:
      type: integer
    exp:
      type: integer

ChangePasswordRequest:
  type: object
  required: [currentPassword, newPassword]
  properties:
    currentPassword:
      type: string
      format: password
      maxLength: 128
    newPassword:
      type: string
      format: password
      minLength: 8
      maxLength: 128
