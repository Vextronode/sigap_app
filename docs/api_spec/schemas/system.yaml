# =====================================================================
# schemas/system.yaml - schema domain Kesehatan Sistem dan scheduler
# =====================================================================

SystemHealth:
  type: object
  properties:
    services:
      type: array
      items:
        type: object
        properties:
          name:
            type: string
          category:
            type: string
            enum: [weather, earthquake, sid, push, database, scheduler]
          status:
            type: string
            enum: [ONLINE, STANDBY, OFFLINE]
          provider:
            type: string
          latencyMs:
            type: integer
            nullable: true
            description: null bila tidak diukur atau pengecekan gagal.
          message:
            type: string
          lastChecked:
            type: string
            format: date-time
    scheduler:
      $ref: './system.yaml#/SchedulerStatus'
    overallStatus:
      type: string
      enum: [HEALTHY, DEGRADED]
      description: HEALTHY bila database, data gempa BMKG, dan scheduler sehat.
    checkedAt:
      type: string
      format: date-time

SchedulerStatus:
  type: object
  description: Status siklus scheduler di memori proses, termasuk siklus dari pemicu eksternal.
  properties:
    state:
      type: string
      enum: [MEMULAI, AKTIF, TERLAMBAT, GAGAL, TIDAK_AKTIF]
      description: >
        TERLAMBAT bila tidak ada siklus sukses selama 3 kali ALERT_SCHEDULER_INTERVAL_MS.
        GAGAL bila siklus terakhir gagal menyimpan alert. TIDAK_AKTIF bila scheduler
        internal mati dan belum ada siklus dari pemicu eksternal.
    enabled:
      type: boolean
    intervalMs:
      type: integer
    running:
      type: boolean
    lastRunAt:
      type: string
      format: date-time
      nullable: true
    lastSuccessAt:
      type: string
      format: date-time
      nullable: true
    consecutiveFailures:
      type: integer

SchedulerResult:
  type: object
  properties:
    level:
      $ref: './shared.yaml#/StatusLevel'
    source:
      type: string
    description:
      type: string
    saved:
      type: boolean
    extended:
      type: boolean
      description: true bila alert rentetan yang berlaku diperpanjang
    ok:
      type: boolean
      description: false bila alert gagal disimpan atau diperpanjang
