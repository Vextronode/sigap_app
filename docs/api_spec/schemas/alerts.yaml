# =====================================================================
# schemas/alerts.yaml - schema domain Alert
# =====================================================================

PublicAlert:
  type: object
  description: Alert untuk endpoint Public, tanpa identitas peninjau.
  properties:
    id:
      type: string
      description: UUID, atau id sintetis untuk hasil evaluasi langsung yang tidak tersimpan
    level:
      $ref: './shared.yaml#/CurrentStatusLevel'
    source:
      type: string
      example: "BMKG (estimasi dari data gempa)"
    description:
      type: string
      nullable: true
    location:
      type: string
      nullable: true
    shakemap:
      type: string
      nullable: true
    reviewStatus:
      type: string
      enum: ["Belum Diverifikasi", Dikonfirmasi, Ditolak, Ditindaklanjuti]
    reviewedAt:
      type: string
      format: date-time
      nullable: true
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time

Alert:
  description: Alert untuk endpoint Protected, dengan identitas peninjau.
  allOf:
    - $ref: './alerts.yaml#/PublicAlert'
    - type: object
      properties:
        reviewedBy:
          type: string
          format: uuid
          nullable: true
        reviewer:
          type: object
          nullable: true
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            email:
              type: string
              format: email
            roles:
              type: array
              items:
                type: string

AlertReviewRequest:
  type: object
  required: [reviewStatus]
  properties:
    reviewStatus:
      type: string
      enum: [Dikonfirmasi, Ditolak, Ditindaklanjuti]
