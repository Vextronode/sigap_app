# =====================================================================
# schemas/shared.yaml - skema lintas domain: envelope, pagination,
# status level, parameter umum
# =====================================================================

SuccessEnvelope:
  type: object
  required: [success, message]
  properties:
    success:
      type: boolean
      enum: [true]
      example: true
    message:
      type: string
      example: "Request successful"

ErrorEnvelope:
  type: object
  required: [success, message, errors]
  properties:
    success:
      type: boolean
      enum: [false]
      example: false
    message:
      type: string
      example: "Gagal mengambil status perangkat."
    errors:
      description: >
        Array of string pada handler umum. Validator permintaan konten, alert,
        dan pengguna mengembalikan objek berkunci nama field. Rute yang tidak
        ditemukan mengembalikan objek kosong.
      oneOf:
        - type: array
          items:
            type: string
        - type: object
          additionalProperties:
            type: string

Pagination:
  type: object
  properties:
    total:
      type: integer
    page:
      type: integer
    limit:
      type: integer
    totalPages:
      type: integer

StatusLevel:
  type: string
  enum: [GREEN, YELLOW, ORANGE, RED]
  description: Nilai enum AlertLevel. Label tampilan adalah Aman, Waspada, Siaga, dan Awas.

IdParam:
  name: id
  in: path
  required: true
  schema:
    type: string
    format: uuid

PageParam:
  name: page
  in: query
  schema:
    type: integer
    default: 1
    minimum: 1

LimitParam:
  name: limit
  in: query
  schema:
    type: integer
    default: 10
    minimum: 1
    maximum: 100
