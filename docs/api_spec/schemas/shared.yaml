# =====================================================================
# schemas/shared.yaml — skema murni lintas domain: envelope, pagination,
# status level, parameter umum. (Duplikasi dgn paths/shared.yaml lama
# sudah dihapus — lihat catatan audit.)
# =====================================================================

SuccessEnvelope:
  type: object
  required: [status, code, message]
  properties:
    status:
      type: string
      enum: [success]
      example: success
    code:
      type: integer
      example: 200
    message:
      type: string
      example: "Request successful"

ErrorEnvelope:
  type: object
  required: [status, code, message]
  properties:
    status:
      type: string
      enum: [error]
      example: error
    code:
      type: integer
      example: 404
    message:
      type: string
      example: "Resource not found"
    errors:
      type: array
      items:
        type: object
        properties:
          field:
            type: string
          message:
            type: string

Pagination:
  type: object
  properties:
    page:
      type: integer
    limit:
      type: integer
    total:
      type: integer

StatusLevel:
  type: string
  enum: [GREEN, YELLOW, ORANGE, RED]
  description: >
    Sama persis dengan AlertLevel enum di backend (schema.prisma) dan
    current_level pada iot_devices. Label tampilan Indonesia (Hijau/
    Kuning/Merah, 3 warna - GREEN+YELLOW digabung) adalah pemetaan di
    sisi frontend, TIDAK dibakukan di sini - lihat FS-06 §8 & PRD §7.
    Sengaja TIDAK memakai istilah Waspada/Siaga/Awas di level ini agar
    tidak tertukar dengan status tsunami resmi InaTEWS (lihat API_SPEC
    v3.1 §11) yang punya skala eskalasi terpisah dan lebih ketat.

IdParam:
  name: id
  in: path
  required: true
  schema:
    type: string
    format: uuid

PageParam:
  name: page
  in: query
  schema:
    type: integer
    default: 1

LimitParam:
  name: limit
  in: query
  schema:
    type: integer
    default: 20
    maximum: 100