# =====================================================================
# schemas/content-admin.yaml - schema domain Pengumuman, Titik Evakuasi,
# Kontak Darurat, Panduan Kesiapsiagaan
# =====================================================================

Announcement:
  type: object
  properties:
    id:
      type: string
    title:
      type: string
    description:
      type: string
    publishedAt:
      type: string
      format: date-time

EvacuationPoint:
  type: object
  properties:
    id:
      type: string
      format: uuid
    name:
      type: string
    address:
      type: string
      nullable: true
    latitude:
      type: number
    longitude:
      type: number
    elevation:
      type: number
      nullable: true
    capacity:
      type: integer
      nullable: true
    description:
      type: string
      nullable: true
    facilities:
      type: array
      items:
        type: string
    isCore:
      type: boolean
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time

EvacuationPointWriteRequest:
  type: object
  required: [name, latitude, longitude]
  description: Field isCore pada request diabaikan.
  properties:
    name:
      type: string
      minLength: 3
      maxLength: 150
    address:
      type: string
      maxLength: 255
      nullable: true
    latitude:
      type: number
      minimum: -90
      maximum: 90
    longitude:
      type: number
      minimum: -180
      maximum: 180
    elevation:
      type: number
      nullable: true
    capacity:
      type: integer
      minimum: 0
      nullable: true
    description:
      type: string
      maxLength: 1000
      nullable: true
    facilities:
      type: array
      maxItems: 20
      items:
        type: string
        maxLength: 100

EmergencyContact:
  type: object
  properties:
    id:
      type: string
      format: uuid
    institution:
      type: string
    phoneNumber:
      type: string
    isCore:
      type: boolean
      description: Kontak inti diisi saat seed dan tidak dapat dihapus lewat API.
    icon:
      type: string
      nullable: true
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time

EmergencyContactWriteRequest:
  type: object
  required: [institution, phoneNumber]
  description: Pada pembaruan, minimal satu field wajib dikirim.
  properties:
    institution:
      type: string
      maxLength: 150
    phoneNumber:
      type: string
      pattern: '^[+0-9\s-]{6,25}$'
    icon:
      type: string
      maxLength: 50

PreparednessGuide:
  type: object
  properties:
    id:
      type: string
      format: uuid
    title:
      type: string
    content:
      type: string
      nullable: true
    externalUrl:
      type: string
      nullable: true
    imageUrl:
      type: string
      nullable: true
    sourceType:
      type: string
      enum: [RESMI, MITRA]
    sourceLabel:
      type: string
      nullable: true
    publishedAt:
      type: string
      format: date-time
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time

PreparednessGuideWriteRequest:
  type: object
  required: [title, imageUrl]
  description: Minimal salah satu dari content atau externalUrl wajib terisi.
  properties:
    title:
      type: string
      maxLength: 150
    content:
      type: string
      nullable: true
    externalUrl:
      type: string
      nullable: true
    imageUrl:
      type: string
    sourceType:
      type: string
      enum: [RESMI, MITRA]
      default: RESMI
    sourceLabel:
      type: string
      nullable: true
    publishedAt:
      type: string
      format: date-time
