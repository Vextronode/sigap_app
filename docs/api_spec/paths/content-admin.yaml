emergency-contacts-public:
  get:
    tags: [Emergency Contacts]
    summary: Daftar kontak darurat
    security: []
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../schemas/shared.yaml#/SuccessEnvelope'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '../schemas/content-admin.yaml#/EmergencyContact'

emergency-contacts-protected:
  post:
    tags: [Emergency Contacts]
    summary: Tambah kontak darurat (selalu isCore=false)
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/content-admin.yaml#/EmergencyContactWriteRequest'
    responses:
      '201':
        description: Berhasil dibuat
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../schemas/shared.yaml#/SuccessEnvelope'
                - type: object
                  properties:
                    data:
                      $ref: '../schemas/content-admin.yaml#/EmergencyContact'
      '401':
        $ref: './shared.yaml#/Unauthorized'
      '403':
        $ref: './shared.yaml#/Forbidden'

emergency-contact-by-id:
  put:
    tags: [Emergency Contacts]
    summary: Perbarui kontak darurat (institution/phoneNumber saja, isCore tidak dapat diubah)
    parameters:
      - $ref: '../schemas/shared.yaml#/IdParam'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/content-admin.yaml#/EmergencyContactWriteRequest'
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../schemas/shared.yaml#/SuccessEnvelope'
                - type: object
                  properties:
                    data:
                      $ref: '../schemas/content-admin.yaml#/EmergencyContact'
      '401':
        $ref: './shared.yaml#/Unauthorized'
      '403':
        $ref: './shared.yaml#/Forbidden'
      '404':
        $ref: './shared.yaml#/NotFound'
  delete:
    tags: [Emergency Contacts]
    summary: Hapus kontak darurat (ditolak jika isCore=true, FS-03 AC3)
    parameters:
      - $ref: '../schemas/shared.yaml#/IdParam'
    responses:
      '204':
        description: Berhasil dihapus (No Content)
      '401':
        $ref: './shared.yaml#/Unauthorized'
      '403':
        $ref: './shared.yaml#/Forbidden'
      '404':
        $ref: './shared.yaml#/NotFound'
      '409':
        description: Kontak ini isCore=true, tidak dapat dihapus (FS-03 AC3)
        $ref: './shared.yaml#/Conflict'