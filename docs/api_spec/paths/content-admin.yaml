# =====================================================================
# paths/content-admin.yaml - path domain Pengumuman, Evakuasi, Kontak Darurat, Panduan
# =====================================================================

announcements-public:
  get:
    tags: [Announcements]
    summary: Daftar pengumuman desa
    security: []
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../schemas/shared.yaml#/SuccessEnvelope'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '../schemas/content-admin.yaml#/Announcement'

evacuation-routes-public:
  get:
    tags: [Evacuation]
    summary: Daftar jalur evakuasi; selalu berisi daftar kosong
    security: []
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../schemas/shared.yaml#/SuccessEnvelope'
                - type: object
                  properties:
                    data:
                      type: array
                      maxItems: 0
                      items:
                        type: object

evacuation-points-public:
  get:
    tags: [Evacuation]
    summary: Daftar titik evakuasi
    security: []
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../schemas/shared.yaml#/SuccessEnvelope'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '../schemas/content-admin.yaml#/EvacuationPoint'

evacuation-points-public-by-id:
  get:
    tags: [Evacuation]
    summary: Detail titik evakuasi
    security: []
    parameters:
      - $ref: '../schemas/shared.yaml#/IdParam'
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../schemas/shared.yaml#/SuccessEnvelope'
                - type: object
                  properties:
                    data:
                      $ref: '../schemas/content-admin.yaml#/EvacuationPoint'
      '404':
        $ref: './shared.yaml#/NotFound'

evacuation-points-protected:
  post:
    tags: [Evacuation]
    summary: Tambah titik evakuasi; permission content.manage
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/content-admin.yaml#/EvacuationPointWriteRequest'
    responses:
      '201':
        description: Berhasil dibuat
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../schemas/shared.yaml#/SuccessEnvelope'
                - type: object
                  properties:
                    data:
                      $ref: '../schemas/content-admin.yaml#/EvacuationPoint'
      '401':
        $ref: './shared.yaml#/Unauthorized'
      '403':
        $ref: './shared.yaml#/Forbidden'
      '422':
        $ref: './shared.yaml#/ValidationFailed'

evacuation-points-protected-by-id:
  put:
    tags: [Evacuation]
    summary: Perbarui titik evakuasi; permission content.manage
    parameters:
      - $ref: '../schemas/shared.yaml#/IdParam'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/content-admin.yaml#/EvacuationPointWriteRequest'
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../schemas/shared.yaml#/SuccessEnvelope'
                - type: object
                  properties:
                    data:
                      $ref: '../schemas/content-admin.yaml#/EvacuationPoint'
      '401':
        $ref: './shared.yaml#/Unauthorized'
      '403':
        $ref: './shared.yaml#/Forbidden'
      '404':
        $ref: './shared.yaml#/NotFound'
      '422':
        $ref: './shared.yaml#/ValidationFailed'
  delete:
    tags: [Evacuation]
    summary: Hapus titik evakuasi; permission content.manage
    parameters:
      - $ref: '../schemas/shared.yaml#/IdParam'
    responses:
      '200':
        description: Berhasil dihapus
        content:
          application/json:
            schema:
              $ref: '../schemas/shared.yaml#/SuccessEnvelope'
      '401':
        $ref: './shared.yaml#/Unauthorized'
      '403':
        $ref: './shared.yaml#/Forbidden'
      '404':
        $ref: './shared.yaml#/NotFound'

