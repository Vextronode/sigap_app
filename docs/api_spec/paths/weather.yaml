# =====================================================================
# paths/weather.yaml - path domain Cuaca
# =====================================================================

weather-current:
  get:
    tags: [Weather]
    summary: Cuaca terkini Desa Cibenda (BMKG dan Open-Meteo)
    security: []
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../schemas/shared.yaml#/SuccessEnvelope'
                - type: object
                  properties:
                    data:
                      $ref: '../schemas/weather.yaml#/CurrentWeather'
      '429':
        $ref: './shared.yaml#/RateLimited'
      '502':
        $ref: './shared.yaml#/UpstreamError'

weather-forecast:
  get:
    tags: [Weather]
    summary: Prakiraan harian 5 hari dari Open-Meteo, dengan cadangan BMKG
    security: []
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../schemas/shared.yaml#/SuccessEnvelope'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '../schemas/weather.yaml#/WeatherForecastItem'
      '429':
        $ref: './shared.yaml#/RateLimited'
      '502':
        $ref: './shared.yaml#/UpstreamError'
