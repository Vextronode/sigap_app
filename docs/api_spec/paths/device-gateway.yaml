# =====================================================================
# paths/device-gateway.yaml — path domain Device Gateway (M2M)
# =====================================================================

device-poll-level:
  get:
    tags: [Device Gateway]
    summary: >
      Unit Utama polling level kesiapsiagaan terkini, setiap 15 detik
      (ADR-013). Response yang sama juga membawa pending command
      trigger sirine digital jika ada - lihat catatan di FS-09 soal
      latensi eksekusi <=15 detik.
    security:
      - deviceApiKey: []
    parameters:
      - $ref: '../schemas/shared.yaml#/IdParam'
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../schemas/shared.yaml#/SuccessEnvelope'
                - type: object
                  properties:
                    data:
                      $ref: '../schemas/device-gateway.yaml#/DeviceLevelResponse'
      '401':
        $ref: './shared.yaml#/Unauthorized'
      '404':
        $ref: './shared.yaml#/NotFound'

device-heartbeat:
  post:
    tags: [Device Gateway]
    summary: >
      Heartbeat setiap 60 detik agar backend menandai online &
      memperbarui lastSeenAt.
    security:
      - deviceApiKey: []
    parameters:
      - $ref: '../schemas/shared.yaml#/IdParam'
    requestBody:
      required: false
      content:
        application/json:
          schema:
            $ref: '../schemas/device-gateway.yaml#/HeartbeatRequest'
    responses:
      '204':
        description: Heartbeat diterima (No Content)
      '401':
        $ref: './shared.yaml#/Unauthorized'
      '404':
        $ref: './shared.yaml#/NotFound'

device-siren-events:
  post:
    tags: [Device Gateway]
    summary: >
      Laporan aktivasi sirine dari Unit Utama - jalur fisik baru
      (relatedActionId kosong) ATAU ack eksekusi command digital
      (relatedActionId diisi). Lihat deskripsi schema untuk detail.
    security:
      - deviceApiKey: []
    parameters:
      - $ref: '../schemas/shared.yaml#/IdParam'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../schemas/device-gateway.yaml#/SirenEventReportRequest'
    responses:
      '201':
        description: Event tercatat/diperbarui
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../schemas/shared.yaml#/SuccessEnvelope'
                - type: object
                  properties:
                    data:
                      $ref: '../schemas/iot-kesiapsiagaan.yaml#/SirenActionLog'
      '401':
        $ref: './shared.yaml#/Unauthorized'
      '404':
        $ref: './shared.yaml#/NotFound'
      '409':
        description: levelAtTrigger bukan ORANGE/RED - safeguard by design
        content:
          application/json:
            schema:
              $ref: '../schemas/shared.yaml#/ErrorEnvelope'