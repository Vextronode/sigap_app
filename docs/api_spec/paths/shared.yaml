# =====================================================================
# paths/shared.yaml — response reusable lintas domain (401/403/404/
# 409/429/502), seluruhnya mereferensikan ErrorEnvelope tunggal di
# schemas/shared.yaml.
# =====================================================================

Unauthorized:
  description: Token tidak ada atau tidak valid
  content:
    application/json:
      schema:
        $ref: '../schemas/shared.yaml#/ErrorEnvelope'
      example:
        success: false
        message: "Token tidak valid atau sudah kedaluwarsa"
        errors: ["Unauthorized"]

Forbidden:
  description: Token valid, tetapi tidak memiliki permission yang dibutuhkan
  content:
    application/json:
      schema:
        $ref: '../schemas/shared.yaml#/ErrorEnvelope'
      example:
        success: false
        message: "Anda tidak memiliki izin untuk mengakses resource ini"
        errors: ["Forbidden"]

NotFound:
  description: Resource tidak ditemukan
  content:
    application/json:
      schema:
        $ref: '../schemas/shared.yaml#/ErrorEnvelope'
      example:
        success: false
        message: "Resource tidak ditemukan"
        errors: ["Not Found"]

Conflict:
  description: Permintaan bertentangan dengan aturan bisnis saat ini
  content:
    application/json:
      schema:
        $ref: '../schemas/shared.yaml#/ErrorEnvelope'
      example:
        success: false
        message: "Tidak dapat menonaktifkan admin terakhir yang aktif"
        errors: ["Conflict"]

RateLimited:
  description: Melebihi batas percobaan (rate limit umum, atau lockout login FS-01)
  content:
    application/json:
      schema:
        $ref: '../schemas/shared.yaml#/ErrorEnvelope'
      example:
        success: false
        message: "Terlalu banyak percobaan gagal. Coba lagi dalam 15 menit."
        errors: ["Rate limit exceeded"]

BmkgUpstreamError:
  description: Gagal mengambil data dari upstream BMKG (502, bukan 500 - API_SPEC.md v3.1 §6)
  content:
    application/json:
      schema:
        $ref: '../schemas/shared.yaml#/ErrorEnvelope'
      example:
        success: false
        message: "Gagal mengambil data dari BMKG, coba lagi nanti"
        errors: ["Bad Gateway"]