# =====================================================================
# paths/earthquakes.yaml - path domain Gempa dan Tsunami
# =====================================================================

earthquake-indonesia:
  get:
    tags: [Earthquakes]
    summary: Gempa terbaru nasional (autogempa BMKG)
    security: []
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../schemas/shared.yaml#/SuccessEnvelope'
                - type: object
                  properties:
                    data:
                      $ref: '../schemas/weather.yaml#/EarthquakeInfo'
      '429':
        $ref: './shared.yaml#/RateLimited'
      '502':
        $ref: './shared.yaml#/UpstreamError'

earthquake-west-java:
  get:
    tags: [Earthquakes]
    summary: Gempa terbaru Jawa Barat (difilter radius, tanpa batas umur)
    security: []
    responses:
      '200':
        description: OK. Data bernilai null bila tidak ada gempa yang lolos filter.
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../schemas/shared.yaml#/SuccessEnvelope'
                - type: object
                  properties:
                    data:
                      $ref: '../schemas/weather.yaml#/EarthquakeInfo'
      '429':
        $ref: './shared.yaml#/RateLimited'
      '502':
        $ref: './shared.yaml#/UpstreamError'

earthquake-pangandaran:
  get:
    tags: [Earthquakes]
    summary: Gempa relevan Pangandaran (radius dan umur difilter)
    security: []
    responses:
      '200':
        description: OK. Data bernilai null bila tidak ada gempa yang lolos filter.
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../schemas/shared.yaml#/SuccessEnvelope'
                - type: object
                  properties:
                    data:
                      $ref: '../schemas/weather.yaml#/EarthquakeInfo'
      '429':
        $ref: './shared.yaml#/RateLimited'
      '502':
        $ref: './shared.yaml#/UpstreamError'

earthquake-map:
  get:
    tags: [Earthquakes]
    summary: Titik sebaran gempa untuk peta
    description: >
      Gabungan feed BMKG yang disatukan per kejadian (autogempa, gempaterkini,
      gempadirasakan) dan 15 rekaman terbaru earthquake_records yang berumur paling
      lama PANGANDARAN_MAX_AGE_DAYS. Rekaman yang lebih tua hanya melengkapi
      shakemap titik feed. Titik di luar wilayah Indonesia dibuang; urutan dari
      kejadian terbaru. Di-cache 30 detik.
    security: []
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../schemas/shared.yaml#/SuccessEnvelope'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '../schemas/weather.yaml#/EarthquakeInfo'
      '429':
        $ref: './shared.yaml#/RateLimited'
      '502':
        $ref: './shared.yaml#/UpstreamError'

tsunami-status:
  get:
    tags: [Tsunami]
    summary: Status tsunami; field source menunjukkan asal status
    security: []
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../schemas/shared.yaml#/SuccessEnvelope'
                - type: object
                  properties:
                    data:
                      $ref: '../schemas/weather.yaml#/TsunamiStatus'
      '429':
        $ref: './shared.yaml#/RateLimited'
      '502':
        $ref: './shared.yaml#/UpstreamError'
