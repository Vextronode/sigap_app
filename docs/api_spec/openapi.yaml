openapi: 3.0.3
info:
  title: SIGAP API
  description: >
    Sistem Informasi dan Kesiapsiagaan Bencana Desa Cibenda. Spesifikasi ini
    mencatat endpoint yang berjalan di backend. Response sukses memakai struktur
    {success: true, message, data}; response error memakai struktur
    {success: false, message, errors}. Seluruh path /public juga dapat diakses
    tanpa segmen /public, misalnya /api/weather/current.
  version: "2.0.0"
  contact:
    name: Tech Lead SIGAP
servers:
  - url: /api
    description: Relatif terhadap origin aplikasi

tags:
  - name: Auth
  - name: Weather
  - name: Earthquakes
  - name: Tsunami
  - name: Alerts
  - name: Device Gateway
  - name: Notifications
  - name: Announcements
  - name: Evacuation
  - name: Emergency Contacts
  - name: Preparedness Guides
  - name: Users
  - name: System
  - name: Health

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    deviceToken:
      type: apiKey
      in: header
      name: x-device-token
      description: Autentikasi perangkat dengan nilai DEVICE_SHARED_KEY.
    cronSecret:
      type: apiKey
      in: header
      name: x-cron-secret
      description: Nilai CRON_SECRET. Dapat juga dikirim lewat Authorization Bearer.

paths:
  # -- Auth --------------------------------------------------------------
  /public/auth/login:
    $ref: './paths/auth.yaml#/login'
  /protected/auth/me:
    $ref: './paths/auth.yaml#/me'
  /protected/auth/logout:
    $ref: './paths/auth.yaml#/logout'
  /protected/auth/change-password:
    $ref: './paths/auth.yaml#/change-password'

  # -- Cuaca --------------------------------------------------------------
