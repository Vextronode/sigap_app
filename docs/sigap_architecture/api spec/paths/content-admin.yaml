# =====================================================================
# content-admin.yaml — path domain Pengumuman, Evakuasi, Kontak Darurat
# =====================================================================

announcements-public:
  get:
    tags: [Announcements]
    summary: Daftar pengumuman
    security: []
    parameters:
      - $ref: '../components/shared.yaml#/PageParam'
      - $ref: '../components/shared.yaml#/LimitParam'
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '../components/content-admin.yaml#/Announcement'

announcements-protected:
  post:
    tags: [Announcements]
    summary: Buat pengumuman baru
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/content-admin.yaml#/AnnouncementWriteRequest'
    responses:
      '201':
        description: Berhasil dibuat
        content:
          application/json:
            schema:
              $ref: '../components/content-admin.yaml#/Announcement'
      '401':
        $ref: '../components/shared.yaml#/Unauthorized'
      '403':
        $ref: '../components/shared.yaml#/Forbidden'

announcement-by-id:
  put:
    tags: [Announcements]
    summary: Perbarui pengumuman
    parameters:
      - $ref: '../components/shared.yaml#/IdParam'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/content-admin.yaml#/AnnouncementWriteRequest'
    responses:
      '200':
        description: OK
        content:
          application/json:
            schema:
              $ref: '../components/content-admin.yaml#/Announcement'
      '401':
        $ref: '../components/shared.yaml#/Unauthorized'
      '403':
        $ref: '../components/shared.yaml#/Forbidden'
      '404':
        $ref: '../components/shared.yaml#/NotFound'
  delete:
    tags: [Announcements]
    summary: Hapus pengumuman
    parameters:
      - $ref: '../components/shared.yaml#/IdParam'
    responses:
      '204':
        description: Berhasil dihapus
      '401':
        $ref: '../components/shared.yaml#/Unauthorized'
      '403':
        $ref: '../components/shared.yaml#/Forbidden'
      '404':
        $ref: '../components/shared.yaml#/NotFound'

