; Firmware Unit Utama SIGAP (ESP32-C3). Kontrak perangkat: ADR-052.
; Build: pio run   Upload: pio run -t upload   Serial: pio device monitor
; Salin include/secrets.example.h menjadi include/secrets.h sebelum build.

[env:unit_utama]
platform = espressif32 @ 8.0.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
lib_deps =
    nrf24/RF24 @ 1.6.2
    bblanchon/ArduinoJson @ 7.4.3
build_flags =
    -DFIRMWARE_VERSION=\"0.1.0\"
